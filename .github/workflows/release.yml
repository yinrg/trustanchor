name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: trustanchor
  APP_DISPLAY_NAME: Trust Anchor
  APP_ID: io.github.yinrg.trustanchor
  MODULE: github.com/yinrg/trustanchor

jobs:
  linux:
    name: linux/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 安装 CGO 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev

      - name: 构建并打包
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          ldflags="-s -w \
            -X ${MODULE}/internal/version.Version=${version} \
            -X ${MODULE}/internal/version.Commit=${GITHUB_SHA:0:7} \
            -X ${MODULE}/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          CGO_ENABLED=1 go build -trimpath -ldflags "$ldflags" -o "${APP_NAME}" .
          tar czf "${APP_NAME}_${version}_linux_${{ matrix.arch }}.tar.gz" "${APP_NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: "*.tar.gz"
          if-no-files-found: error

  windows:
    name: windows/amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: 生成 Windows 资源
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          go run github.com/tc-hib/go-winres@v0.3.3 simply --arch amd64 --out rsrc `
            --icon assets/icon.png --manifest gui `
            --product-version $version --file-version $version `
            --product-name "Trust Anchor" --file-description "Trust Anchor" `
            --original-filename trustanchor.exe

      - name: 构建并打包
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $commit = $env:GITHUB_SHA.Substring(0, 7)
          $date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $ldflags = "-H windowsgui -s -w -X $env:MODULE/internal/version.Version=$version -X $env:MODULE/internal/version.Commit=$commit -X $env:MODULE/internal/version.Date=$date"

          $env:CGO_ENABLED = "1"
          $env:CC = "gcc"
          go build -trimpath -ldflags $ldflags -o trustanchor.exe .

          Compress-Archive -Path trustanchor.exe `
            -DestinationPath "trustanchor_${version}_windows_amd64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: "*.zip"
          if-no-files-found: error

  darwin:
    name: darwin/universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 生成 icns
        run: |
          set -euo pipefail
          mkdir -p icon.iconset
          sips -z 16 16     assets/icons/16x16.png   --out icon.iconset/icon_16x16.png >/dev/null
          sips -z 32 32     assets/icons/32x32.png   --out icon.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32     assets/icons/32x32.png   --out icon.iconset/icon_32x32.png >/dev/null
          sips -z 64 64     assets/icons/64x64.png   --out icon.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128   assets/icons/128x128.png --out icon.iconset/icon_128x128.png >/dev/null
          sips -z 256 256   assets/icons/256x256.png --out icon.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256   assets/icons/256x256.png --out icon.iconset/icon_256x256.png >/dev/null
          sips -z 512 512   assets/icons/512x512.png --out icon.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512   assets/icons/512x512.png --out icon.iconset/icon_512x512.png >/dev/null
          sips -z 1024 1024 assets/icons/512x512.png --out icon.iconset/icon_512x512@2x.png >/dev/null
          iconutil -c icns icon.iconset -o AppIcon.icns

      - name: 构建并打包
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          for arch in amd64 arm64; do
            ldflags="-s -w \
              -X ${MODULE}/internal/version.Version=${version} \
              -X ${MODULE}/internal/version.Commit=${GITHUB_SHA:0:7} \
              -X ${MODULE}/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

            CGO_ENABLED=1 GOOS=darwin GOARCH="${arch}" \
              go build -trimpath -ldflags "$ldflags" -o "trustanchor-${arch}" .

            app="${APP_DISPLAY_NAME}.app"
            rm -rf "$app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            cp "trustanchor-${arch}" "$app/Contents/MacOS/${APP_NAME}"
            cp AppIcon.icns "$app/Contents/Resources/AppIcon.icns"

            cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>${APP_DISPLAY_NAME}</string>
            <key>CFBundleDisplayName</key>
            <string>${APP_DISPLAY_NAME}</string>
            <key>CFBundleIdentifier</key>
            <string>${APP_ID}</string>
            <key>CFBundleExecutable</key>
            <string>${APP_NAME}</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${version}</string>
            <key>CFBundleVersion</key>
            <string>${version}</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

            ditto -c -k --sequesterRsrc --keepParent "$app" \
              "${APP_NAME}_${version}_darwin_${arch}.zip"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: "*.zip"
          if-no-files-found: error

  publish:
    name: publish
    needs: [linux, windows, darwin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 校验资产命名
        run: |
          set -euo pipefail
          ls -l dist
          for f in dist/*; do
            case "$f" in
              *_linux_amd64.tar.gz|*_linux_arm64.tar.gz|*_windows_amd64.zip|*_darwin_amd64.zip|*_darwin_arm64.zip) ;;
              *) echo "资产命名不符合自动更新规则: $f"; exit 1 ;;
            esac
          done

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
